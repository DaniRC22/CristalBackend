# ════════════════════════════════════════════════════════════
# nginx config para Cristal Equipamientos Comerciales
# Ubicación: /etc/nginx/sites-available/cristalequipamientos.conf
#
# Cliente:  Cristal Equipamientos Comerciales
# Dominio:  cristalequipamientos.com
# VPS IP:   76.13.119.171
#
# Después: certbot --nginx -d ... agrega automáticamente los
# bloques HTTPS (443), el redirect HTTP→HTTPS y la config TLS
# moderna (options-ssl-nginx.conf: TLS 1.2/1.3 + ciphers).
# ════════════════════════════════════════════════════════════

# Rate limit a nivel proxy para la API (defensa en profundidad sobre el
# rate-limit de express). 20 req/s por IP con ráfagas de hasta 40.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ── www → apex (301) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.cristalequipamientos.com;
    server_tokens off;
    return 301 $scheme://cristalequipamientos.com$request_uri;
}

# ── Frontend (estático) ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cristalequipamientos.com;
    server_tokens off;

    root /var/www/CristalFrontend/dist;
    index index.html;

    # SPA: rutas no encontradas → index.html (React Router maneja)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El sitemap lo genera el backend; se sirve bajo el dominio principal
    # para que robots.txt lo referencie en el mismo host.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Cache largo en assets versionados
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — certbot NO lo agrega. Inofensivo en :80, activo en :443.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}

# ── Backend API (reverse proxy a localhost:4000) ───────────
server {
    listen 80;
    listen [::]:80;
    server_name api.cristalequipamientos.com;
    server_tokens off;

    # sharp procesa imágenes — permitir uploads más grandes
    client_max_body_size 10M;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
